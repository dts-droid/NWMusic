<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0F15">
<title>GigRadar NW</title>
<style>
  :root{
    --ink:#0D0F15; --panel:#151823; --line:#232737; --line2:#2E3346;
    --stub:#FF5A1F; --stub-deep:#D9430E; --cream:#F3ECDD; --cream-ink:#241A10;
    --go:#34C97B; --warn:#F2B33D; --bad:#F26D6D;
    --text:#EEF0F4; --muted:#8B92A5; --dim:#565D70;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{background:var(--ink);color:var(--text);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    min-height:100dvh;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:15px;color:var(--text);
    background:var(--ink);border:1px solid var(--line2);border-radius:10px;
    padding:11px 12px;width:100%}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--stub);outline-offset:1px}
  a{color:var(--go)}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(13,15,21,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    display:flex;align-items:center;gap:10px}
  .wordmark{font-weight:900;font-size:17px;letter-spacing:-.04em}
  .wordmark em{font-style:normal;color:var(--stub)}
  .fresh{margin-left:auto;text-align:right;font-family:var(--mono);font-size:10px;
    color:var(--dim);line-height:1.5}
  .fresh b{color:var(--go);font-weight:600}
  .fresh.sample b{color:var(--warn)}

  main{padding:16px 16px 28px;max-width:560px;margin:0 auto}
  .eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--dim);
    text-transform:uppercase;margin:22px 0 10px}
  .eyebrow:first-child{margin-top:2px}
  .note{font-size:12px;color:var(--dim);line-height:1.55}

  /* banner */
  .banner{border:1px solid #4a3a14;background:#221A07;color:var(--warn);
    border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.5;margin-bottom:16px}

  /* ── signature: ticket stub card ── */
  .gig{display:flex;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;margin-bottom:10px;text-align:left;
    width:100%;transition:transform .08s ease}
  .gig:active{transform:scale(.985)}
  .stubdate{flex:0 0 64px;background:var(--cream);color:var(--cream-ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;padding:12px 4px;position:relative;
    border-right:2px dashed rgba(36,26,16,.4)}
  .stubdate::before,.stubdate::after{content:"";position:absolute;right:-8px;
    width:14px;height:14px;border-radius:50%;background:var(--ink)}
  .stubdate::before{top:-8px}
  .stubdate::after{bottom:-8px}
  .stubdate .dow{font-family:var(--mono);font-size:9px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;opacity:.65}
  .stubdate .day{font-weight:900;font-size:23px;line-height:1;letter-spacing:-.03em}
  .stubdate .mon{font-family:var(--mono);font-size:10px;font-weight:700;
    text-transform:uppercase;letter-spacing:.1em}
  .gig.soon .stubdate{background:var(--stub);color:#fff}
  .gig.soon .stubdate{border-right-color:rgba(255,255,255,.5)}
  .gigbody{flex:1;min-width:0;padding:11px 13px}
  .gigartist{font-weight:900;font-size:15px;letter-spacing:-.02em;
    text-transform:uppercase;line-height:1.15;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gigvenue{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .gigmeta{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
  .price{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--go)}
  .srcpill{font-family:var(--mono);font-size:9.5px;color:var(--dim);
    border:1px solid var(--line2);border-radius:99px;padding:2px 7px}
  .match{margin-left:auto;font-family:var(--mono);font-weight:800;font-size:13px}

  /* expanded gig detail */
  .gigx{background:var(--panel);border:1px solid var(--line2);border-top:none;
    border-radius:0 0 14px 14px;margin:-11px 0 10px;padding:13px}
  .ticketrow{display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .ticketrow:first-of-type{border-top:none;padding-top:2px}
  .ticketrow a{font-weight:700;text-decoration:none}
  .xactions{display:flex;gap:8px;margin-top:11px}
  .chipbtn{flex:1;text-align:center;border:1px solid var(--line2);border-radius:10px;
    padding:9px 6px;font-size:12px;font-weight:700;color:var(--text);text-decoration:none}
  .chipbtn.spot{border-color:#1A4A30;color:var(--go)}

  /* chips / filters */
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;
    scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line2);border-radius:99px;
    padding:7px 13px;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel)}
  .chip.on{background:var(--stub);border-color:var(--stub);color:#fff}

  /* artist rows */
  .artist{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:12px 13px;margin-bottom:9px}
  .arow{display:flex;align-items:center;gap:10px}
  .aname{font-weight:800;font-size:14px;letter-spacing:-.01em;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .anext{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
  .rates{display:flex;gap:6px;margin-top:10px}
  .rate{flex:1;border:1px solid var(--line2);border-radius:9px;padding:8px 0;
    font-size:15px;text-align:center;background:var(--ink);transition:opacity .12s}
  .rate.on{background:var(--stub);border-color:var(--stub)}
  .rates.haspick .rate:not(.on){opacity:.4}
  .alinks{display:flex;gap:10px;margin-top:9px}
  .alinks a{font-size:11.5px;font-weight:700;text-decoration:none}

  /* stats strip */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 6px;text-align:center}
  .stat b{display:block;font-size:21px;font-weight:900;letter-spacing:-.03em}
  .stat span{font-size:10px;color:var(--dim)}

  /* buttons */
  .big{width:100%;border-radius:12px;padding:14px;font-size:13.5px;font-weight:900;
    letter-spacing:.04em;text-transform:uppercase;background:var(--stub);color:#fff}
  .big:disabled{background:var(--panel);color:var(--dim)}
  .ghost{width:100%;border:1px solid var(--line2);border-radius:12px;padding:12px;
    font-size:13px;font-weight:700;color:var(--muted);background:var(--panel)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);
    margin-bottom:6px}

  /* AI cards */
  .aicard{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:14px;margin-bottom:10px;font-size:13px;line-height:1.6}
  .aicard.profile{border-color:#1A4A30;background:#0F1A14}
  .tag{display:inline-block;border:1px solid var(--line2);border-radius:99px;
    padding:3px 10px;font-size:11px;color:var(--muted);margin:3px 4px 0 0}
  .tag.gold{color:var(--warn);border-color:#4a3a14}

  /* settings */
  .srcstat{display:flex;justify-content:space-between;padding:8px 0;font-size:12.5px;
    border-top:1px solid var(--line);font-family:var(--mono)}
  .srcstat:first-of-type{border-top:none}
  .ok{color:var(--go)} .err{color:var(--bad)} .skip{color:var(--dim)}

  /* tab bar */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
    background:rgba(13,15,21,.96);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;padding:9px 2px 7px;display:flex;flex-direction:column;
    align-items:center;gap:2px;font-size:9.5px;font-weight:700;color:var(--dim)}
  nav button.on{color:var(--stub)}
  nav .ico{font-size:18px;line-height:1}

  .toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;
    background:var(--cream);color:var(--cream-ink);font-weight:700;font-size:13px;
    border-radius:99px;padding:10px 18px;max-width:88vw;text-align:center;
    box-shadow:0 6px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:opacity .25s}
  .toast.show{opacity:1}
  .spin{display:inline-block;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}}
  .empty{text-align:center;color:var(--dim);font-size:13px;padding:40px 16px;line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="wordmark">GIG<em>RADAR</em> NW</div>
  <div class="fresh" id="fresh">loading…</div>
</header>

<main id="main"></main>

<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================== state ==================================== */
const LS = {
  get k(){ return JSON.parse(localStorage.getItem("gr_settings")||"{}"); },
  set k(v){ localStorage.setItem("gr_settings", JSON.stringify(v)); },
  get ratings(){ return JSON.parse(localStorage.getItem("gr_ratings")||"{}"); },
  set ratings(v){ localStorage.setItem("gr_ratings", JSON.stringify(v)); },
  get ai(){ return JSON.parse(localStorage.getItem("gr_ai")||"null"); },
  set ai(v){ localStorage.setItem("gr_ai", JSON.stringify(v)); },
};
let DATA = {gigs:[], sample:true, generated_at:null};
let HEALTH = null;
let tab = "today";
let openGig = null;
let cityFilter = "all";
let query = "";
let aiBusy = false;

const RATES = [["love","⭐"],["like","👍"],["meh","➖"],["nope","👎"]];
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============================== data ===================================== */
async function loadData(bust){
  try{
    const r = await fetch("data/gigs.json"+(bust?("?t="+Date.now()):""),{cache:"no-store"});
    DATA = await r.json();
  }catch(e){ /* keep whatever we have */ }
  try{
    const r = await fetch("data/last_run.json"+(bust?("?t="+Date.now()):""),{cache:"no-store"});
    HEALTH = await r.json();
  }catch(e){ HEALTH = null; }
  // drop past dates client-side so the list self-cleans between refreshes
  const today = new Date().toISOString().slice(0,10);
  DATA.gigs = (DATA.gigs||[]).filter(g=>g.date>=today);
  render();
}

const daysTo = d => Math.max(0, Math.ceil((new Date(d+"T12:00") - Date.now())/864e5));
const fmtDate = d => new Date(d+"T12:00").toLocaleDateString("en-GB",
  {weekday:"short",day:"numeric",month:"short"});
const minPrice = g => { const p=g.sources.map(s=>s.price).filter(x=>x!=null);
  return p.length?Math.min(...p):null; };
const spotify = a => "https://open.spotify.com/search/"+encodeURIComponent(a);
const maps = g => "https://www.google.com/maps/search/?api=1&query="+
  encodeURIComponent(g.venue+", "+(g.postcode||g.city||""));

function artists(){
  const m = new Map();
  for(const g of DATA.gigs){
    if(!g.artist) continue;
    const k = g.artist.toLowerCase();
    if(!m.has(k)) m.set(k,{name:g.artist,gigs:[]});
    m.get(k).gigs.push(g);
  }
  return [...m.values()].sort((a,b)=>a.gigs[0].date<b.gigs[0].date?-1:1);
}

/* ============================== ui bits ================================== */
function toast(msg, ms=2600){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),ms);
}

function stubCard(g, opts={}){
  const d = new Date(g.date+"T12:00");
  const soon = daysTo(g.date)<=7 ? " soon":"";
  const p = minPrice(g);
  const ai = (LS.ai&&LS.ai.scores&&LS.ai.scores[g.id])||null;
  const matchCol = ai ? (ai.score>=85?"var(--go)":ai.score>=70?"var(--warn)":"var(--muted)") : "";
  return `<button class="gig${soon}" data-gig="${g.id}" aria-expanded="${openGig===g.id}">
    <div class="stubdate">
      <span class="dow">${d.toLocaleDateString("en-GB",{weekday:"short"})}</span>
      <span class="day">${d.getDate()}</span>
      <span class="mon">${d.toLocaleDateString("en-GB",{month:"short"})}</span>
    </div>
    <div class="gigbody">
      <div class="gigartist">${esc(g.artist||g.title)}</div>
      <div class="gigvenue">${esc(g.venue)}${g.city?" · "+esc(g.city):""}</div>
      <div class="gigmeta">
        ${p!=null?`<span class="price">£${p%1?p.toFixed(2):p}</span>`:""}
        ${g.sources.slice(0,3).map(s=>`<span class="srcpill">${esc(s.name)}</span>`).join("")}
        ${ai?`<span class="match" style="color:${matchCol}">${ai.score}%</span>`:""}
      </div>
    </div>
  </button>
  ${openGig===g.id?gigDetail(g,ai):""}`;
}

function gigDetail(g, ai){
  const rows = g.sources.map(s=>`<div class="ticketrow">
      <span>${esc(s.name)}${s.price!=null?` <span class="price">£${s.price%1?s.price.toFixed(2):s.price}</span>`:""}</span>
      ${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">Tickets →</a>`:""}
    </div>`).join("");
  return `<div class="gigx">
    ${g.title&&g.title!==g.artist?`<div class="note" style="margin-bottom:8px">${esc(g.title)}</div>`:""}
    ${ai?`<div class="note" style="color:var(--warn);margin-bottom:8px">AI: ${esc(ai.reason)}</div>`:""}
    ${rows||'<div class="note">No ticket links captured for this one.</div>'}
    <div class="xactions">
      <a class="chipbtn spot" href="${spotify(g.artist)}" target="_blank" rel="noopener">▶ Spotify</a>
      <a class="chipbtn" href="${maps(g)}" target="_blank" rel="noopener">📍 Map</a>
    </div>
  </div>`;
}

/* ============================== tabs ===================================== */
function vToday(){
  const gigs = DATA.gigs;
  if(!gigs.length) return `<div class="empty">No upcoming gigs in the feed yet.<br>
    Run your first refresh from the Settings tab.</div>`;
  const next = gigs[0];
  const week = gigs.filter(g=>daysTo(g.date)<=7);
  const rated = Object.values(LS.ratings).filter(Boolean).length;
  return `
    ${DATA.sample?`<div class="banner">Showing sample data — finish setup (Settings tab)
      and run your first refresh to load real North West listings.</div>`:""}
    <div class="eyebrow">Next up · ${daysTo(next.date)} day${daysTo(next.date)===1?"":"s"} away</div>
    ${stubCard(next)}
    <div class="eyebrow">The numbers</div>
    <div class="stats">
      <div class="stat"><b style="color:var(--stub)">${gigs.length}</b><span>gigs ahead</span></div>
      <div class="stat"><b style="color:var(--go)">${week.length}</b><span>this week</span></div>
      <div class="stat"><b style="color:var(--warn)">${rated}</b><span>artists rated</span></div>
    </div>
    ${week.length>1?`<div class="eyebrow">This week</div>${week.slice(1).map(g=>stubCard(g)).join("")}`:""}
    <div class="eyebrow">Coming up</div>
    ${gigs.filter(g=>daysTo(g.date)>7).slice(0,8).map(g=>stubCard(g)).join("")||'<div class="note">Nothing beyond this week yet.</div>'}`;
}

function vGigs(){
  const cities = ["all",...new Set(DATA.gigs.map(g=>g.city).filter(Boolean))].slice(0,9);
  let list = DATA.gigs;
  if(cityFilter!=="all") list = list.filter(g=>g.city===cityFilter);
  if(query) { const q=query.toLowerCase();
    list = list.filter(g=>(g.artist+" "+g.title+" "+g.venue).toLowerCase().includes(q)); }
  return `
    <div class="field"><input id="q" type="search" placeholder="Search artist or venue…" value="${esc(query)}"></div>
    <div class="chips">${cities.map(c=>
      `<button class="chip ${cityFilter===c?"on":""}" data-city="${esc(c)}">${c==="all"?"All":esc(c)}</button>`).join("")}</div>
    ${list.map(g=>stubCard(g)).join("")||'<div class="empty">No gigs match.</div>'}
    <p class="note" style="margin-top:14px">${list.length} of ${DATA.gigs.length} gigs ·
    sources: Ticketmaster, Skiddle, Ents24, Bandsintown + venue sites · duplicates merged.</p>`;
}

function vArtists(){
  const list = artists();
  if(!list.length) return '<div class="empty">No artists yet — load some gig data first.</div>';
  const r = LS.ratings;
  return `
    <p class="note" style="margin-bottom:14px">Rate acts to teach the AI your taste.
    Ratings stay on this phone. ▶ opens the artist on Spotify.</p>
    ${list.map(a=>{
      const cur = r[a.name.toLowerCase()];
      return `<div class="artist">
        <div class="arow">
          <span class="aname">${esc(a.name)}</span>
          <span class="anext">${fmtDate(a.gigs[0].date)}</span>
        </div>
        <div class="rates ${cur?"haspick":""}" data-artist="${esc(a.name.toLowerCase())}">
          ${RATES.map(([v,ic])=>`<button class="rate ${cur===v?"on":""}" data-rate="${v}">${ic}</button>`).join("")}
        </div>
        <div class="alinks">
          <a href="${spotify(a.name)}" target="_blank" rel="noopener" style="color:var(--go)">▶ Spotify</a>
          <span class="note">${a.gigs.length} show${a.gigs.length===1?"":"s"} · ${esc(a.gigs[0].venue)}</span>
        </div>
      </div>`; }).join("")}`;
}

function vAI(){
  const rated = Object.entries(LS.ratings).filter(([,v])=>v);
  const need = Math.max(0, 3-rated.length);
  const s = LS.k;
  const out = LS.ai;
  return `
    <div class="eyebrow">Your AI gig matcher</div>
    <p class="note" style="margin-bottom:12px">Claude reads your artist ratings and ranks
    every upcoming gig against your taste. Uses your own Anthropic API key
    (Settings) — a full analysis costs well under a penny.</p>
    <button class="big" id="aiBtn" ${need||aiBusy||!s.anthropicKey?"disabled":""}>
      ${aiBusy?'<span class="spin">◌</span> Analysing your taste…'
        : !s.anthropicKey?"Add your Anthropic key in Settings"
        : need?`Rate ${need} more artist${need===1?"":"s"} to unlock`
        : "✨ Get my matches"}</button>
    ${out&&!aiBusy?renderAI(out):""}
    ${out&&out.at?`<p class="note" style="margin-top:10px">Last analysed ${new Date(out.at).toLocaleString("en-GB")}</p>`:""}`;
}

function renderAI(out){
  const ranked = DATA.gigs.filter(g=>out.scores&&out.scores[g.id])
    .sort((a,b)=>out.scores[b.id].score-out.scores[a.id].score);
  return `
    ${out.profile?`<div class="aicard profile" style="margin-top:14px">
      <div class="eyebrow" style="margin:0 0 8px;color:var(--go)">Your taste profile</div>
      ${esc(out.profile.summary||"")}
      <div>${(out.profile.genres||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join("")}</div>
      ${out.insight?`<div class="note" style="margin-top:9px;font-style:italic">“${esc(out.insight)}”</div>`:""}
    </div>`:""}
    ${(out.profile&&out.profile.discover&&out.profile.discover.length)?`
      <div class="eyebrow">Not playing yet — but you'd love</div>
      <div style="margin-bottom:6px">${out.profile.discover.map(a=>
        `<a class="tag gold" style="text-decoration:none" target="_blank" rel="noopener"
           href="${spotify(a)}">▶ ${esc(a)}</a>`).join("")}</div>`:""}
    ${ranked.length?`<div class="eyebrow">Ranked for you</div>
      ${ranked.map(g=>stubCard(g)).join("")}`:""}`;
}

function vSettings(){
  const s = LS.k;
  const srcs = HEALTH?Object.entries(HEALTH.sources||{}):[];
  return `
    <div class="eyebrow">Data feed</div>
    <div class="aicard">
      ${DATA.generated_at?`<div class="note" style="margin-bottom:8px">Last refresh:
        <b style="color:var(--text)">${new Date(DATA.generated_at).toLocaleString("en-GB")}</b>
        · ${DATA.count??DATA.gigs.length} gigs${DATA.sample?" (sample)":""}</div>`:""}
      ${srcs.length?srcs.map(([k,v])=>`<div class="srcstat"><span>${esc(k)}</span>
        <span class="${v.status==="ok"?"ok":v.status==="skipped"?"skip":"err"}">
        ${esc(v.status)} · ${v.events}</span></div>`).join("")
        :'<div class="note">No pipeline report yet — appears after your first refresh.</div>'}
    </div>
    <button class="big" id="refreshBtn" style="margin-bottom:9px"
      ${!s.ghToken||!s.ghRepo?"disabled":""}>⟳ Refresh now</button>
    <button class="ghost" id="reloadBtn">Reload latest data</button>
    <p class="note" style="margin:8px 0 0">“Refresh now” triggers the full pipeline on GitHub —
    new data lands in about two minutes, then tap Reload.</p>

    <div class="eyebrow">GitHub (for the refresh button)</div>
    <div class="field"><label>Repository (owner/name)</label>
      <input id="ghRepo" placeholder="yourname/gigradar-nw" value="${esc(s.ghRepo||"")}"></div>
    <div class="field"><label>Fine-grained token (Actions: read &amp; write)</label>
      <input id="ghToken" type="password" placeholder="github_pat_…" value="${esc(s.ghToken||"")}"></div>

    <div class="eyebrow">Anthropic (for AI matches)</div>
    <div class="field"><label>API key</label>
      <input id="anthropicKey" type="password" placeholder="sk-ant-…" value="${esc(s.anthropicKey||"")}"></div>
    <div class="field"><label>Model</label>
      <input id="model" value="${esc(s.model||"claude-haiku-4-5-20251001")}"></div>
    <button class="big" id="saveBtn">Save settings</button>
    <p class="note" style="margin-top:10px">Keys are stored only in this browser on this device —
    never in the repository, never sent anywhere except GitHub/Anthropic directly.</p>

    <div class="eyebrow">About</div>
    <p class="note">GigRadar NW · personal, non-commercial gig discovery.<br>
    Listings powered by <a href="https://www.ents24.com" target="_blank" rel="noopener">Ents24</a>,
    <a href="https://www.skiddle.com" target="_blank" rel="noopener">Skiddle</a>,
    Ticketmaster &amp; Bandsintown, plus venues' own sites.</p>
    <button class="ghost" id="wipeBtn" style="margin-top:12px;color:var(--bad)">Clear ratings &amp; AI results on this device</button>`;
}

/* ============================== AI call ================================== */
async function runAI(){
  const s = LS.k;
  if(!s.anthropicKey) return;
  aiBusy = true; render();
  const taste = Object.entries(LS.ratings).filter(([,v])=>v)
    .map(([artist,rating])=>({artist,rating}));
  const gigList = DATA.gigs.slice(0,45).map(g=>({id:g.id,artist:g.artist,
    venue:g.venue,city:g.city,date:g.date,genres:g.genres,
    price:minPrice(g)}));
  const prompt = `You are the recommendation engine for a North West England live-music app.

User's artist ratings (love/like/meh/nope):
${JSON.stringify(taste)}

Upcoming gigs:
${JSON.stringify(gigList)}

Reply with ONLY valid JSON, no markdown fences:
{
 "profile": {"summary":"2-3 sentences on their taste","genres":["3-5 genres"],
   "discover":["3 artists NOT in the gig list they'd love"]},
 "insight": "one sharp observation about their taste, max 18 words",
 "recs": [{"id":"gig id from the list","score":0-100,"reason":"personal, under 14 words"}]
}
Score and include every gig that is at least a moderate fit; omit poor fits.`;
  try{
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"content-type":"application/json","x-api-key":s.anthropicKey,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:s.model||"claude-haiku-4-5-20251001",
        max_tokens:1400,messages:[{role:"user",content:prompt}]})});
    const js = await r.json();
    if(js.error) throw new Error(js.error.message||"API error");
    const text = (js.content||[]).map(c=>c.text||"").join("");
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
    const scores = {};
    for(const rec of parsed.recs||[])
      if(rec.id) scores[rec.id]={score:Math.round(rec.score),reason:rec.reason||""};
    LS.ai = {profile:parsed.profile,insight:parsed.insight,scores,at:Date.now()};
    toast("Matches ready ✨");
  }catch(e){ toast("AI call failed: "+String(e.message||e).slice(0,80),4000); }
  aiBusy = false; render();
}

/* ============================ manual refresh ============================= */
async function triggerRefresh(){
  const s = LS.k;
  const btn = $("refreshBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin">◌</span> Starting…';
  try{
    const r = await fetch(`https://api.github.com/repos/${s.ghRepo}/actions/workflows/update-gigs.yml/dispatches`,{
      method:"POST",
      headers:{Authorization:"Bearer "+s.ghToken,
        Accept:"application/vnd.github+json",
        "X-GitHub-Api-Version":"2022-11-28"},
      body:JSON.stringify({ref:"main"})});
    if(r.status===204){
      toast("Refresh running — new data in ~2 min, then tap Reload",4500);
    } else {
      const j = await r.json().catch(()=>({}));
      toast("GitHub said: "+(j.message||r.status),4500);
    }
  }catch(e){ toast("Couldn't reach GitHub: "+e.message,4000); }
  render();
}

/* ============================== events =================================== */
const TABS = [["today","⌂","Today"],["gigs","🎫","Gigs"],
  ["artists","♫","Artists"],["ai","✦","AI"],["settings","⚙","Settings"]];

function render(){
  $("nav").innerHTML = TABS.map(([id,ic,l])=>
    `<button class="${tab===id?"on":""}" data-tab="${id}">
       <span class="ico">${ic}</span>${l}</button>`).join("");
  $("main").innerHTML =
    tab==="today"?vToday():tab==="gigs"?vGigs():tab==="artists"?vArtists()
    :tab==="ai"?vAI():vSettings();
  const f=$("fresh");
  if(DATA.generated_at){
    f.className="fresh"+(DATA.sample?" sample":"");
    f.innerHTML=`${(DATA.gigs||[]).length} gigs · NW England<br>
      <b>${DATA.sample?"sample data":"updated "+new Date(DATA.generated_at)
        .toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</b>`;
  }
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab],[data-gig],[data-city],.rate,#aiBtn,#saveBtn,#refreshBtn,#reloadBtn,#wipeBtn");
  if(!t) return;
  if(t.dataset.tab){ tab=t.dataset.tab; openGig=null; render(); window.scrollTo(0,0); }
  else if(t.dataset.gig){ openGig = openGig===t.dataset.gig?null:t.dataset.gig; render(); }
  else if(t.dataset.city){ cityFilter=t.dataset.city; render(); }
  else if(t.classList.contains("rate")){
    const artist=t.closest(".rates").dataset.artist, v=t.dataset.rate;
    const r=LS.ratings; r[artist]=r[artist]===v?undefined:v; LS.ratings=r; render();
  }
  else if(t.id==="aiBtn") runAI();
  else if(t.id==="reloadBtn"){ toast("Reloading…"); loadData(true); }
  else if(t.id==="refreshBtn") triggerRefresh();
  else if(t.id==="wipeBtn"){ localStorage.removeItem("gr_ratings");
    localStorage.removeItem("gr_ai"); toast("Cleared"); render(); }
  else if(t.id==="saveBtn"){
    LS.k={ghRepo:$("ghRepo").value.trim(),ghToken:$("ghToken").value.trim(),
      anthropicKey:$("anthropicKey").value.trim(),
      model:$("model").value.trim()||"claude-haiku-4-5-20251001"};
    toast("Saved ✓"); render();
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ query=e.target.value;
    clearTimeout(window._qh); window._qh=setTimeout(render,180);
    requestAnimationFrame(()=>{const i=$("q"); if(i){i.focus();
      i.setSelectionRange(i.value.length,i.value.length);}});
  }
});

loadData(false);
</script>
